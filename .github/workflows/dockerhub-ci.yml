name: Docker Hub + SonarCloud Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

            # Escaneo directo de SonarCloud sin ejecutar test
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=CardenasAlonso_AS241S5_AEJ_05-fe \
            -Dsonar.organization=cardenasalonso \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src \
            -Dsonar.qualitygate.wait=true
            
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-analyze
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_HANCEL }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}/as241s5_aej_05-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}/as241s5_aej_05-fe:${{ github.sha }}
